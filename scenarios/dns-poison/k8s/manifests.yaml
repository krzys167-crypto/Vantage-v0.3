# Split-Brain DNS on k3d. Applied by framework scenario_up into namespace vantage-dns.
# ConfigMaps `scenario`, `app-code`, `zone`, `svc-config` and Secret `keys` are
# created from .state/ by scripts/k8s_objects.sh. Services the zone points at
# use fixed ClusterIPs (NET.0/24 inside k3s' default service CIDR: 10.43.240,
# or a per-session /24 picked by the hosted range) so that A records are
# stable, as they would be for real hosts.
apiVersion: v1
kind: Service
metadata: {name: dns}
spec:
  clusterIP: {{NET}}.10
  selector: {app: dns}
  ports:
    - {name: dns, port: 53, protocol: UDP, targetPort: 53}
    - {name: admin, port: 8053, protocol: TCP, targetPort: 8053}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dns, labels: {app: dns}}
spec:
  replicas: 1
  selector: {matchLabels: {app: dns}}
  template:
    metadata: {labels: {app: dns}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dns
          image: mirror.gcr.io/library/python:3.12-alpine
          workingDir: /app
          command: ["python", "-u", "dns_server.py"]
          ports: [{containerPort: 53, protocol: UDP}, {containerPort: 8053}]
          readinessProbe: {tcpSocket: {port: 8053}, periodSeconds: 2}
          resources: {limits: {cpu: 200m, memory: 64Mi}, requests: {cpu: 10m, memory: 16Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: zone, mountPath: /zone, readOnly: true}
      volumes:
        - {name: code, configMap: {name: app-code}}
        - {name: zone, configMap: {name: zone}}
---
apiVersion: v1
kind: Service
metadata: {name: payments}
spec: {clusterIP: {{NET}}.20, selector: {app: payments}, ports: [{port: 8090}]}
---
apiVersion: v1
kind: Service
metadata: {name: legacy}
spec: {clusterIP: {{NET}}.21, selector: {app: legacy}, ports: [{port: 8090}]}
---
apiVersion: v1
kind: Service
metadata: {name: fx}
spec: {clusterIP: {{NET}}.30, selector: {app: fx}, ports: [{port: 8090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments, labels: {app: payments}}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments}}
  template:
    metadata: {labels: {app: payments}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: mirror.gcr.io/library/python:3.12-alpine
          workingDir: /app
          command: ["python", "-u", "server.py"]
          env:
            - {name: ROLE, value: payments}
            - {name: PORT, value: "8090"}
            - {name: INSTANCE, value: payments}
          ports: [{containerPort: 8090}]
          readinessProbe: {tcpSocket: {port: 8090}, periodSeconds: 2}
          resources: {limits: {cpu: 100m, memory: 64Mi}, requests: {cpu: 10m, memory: 16Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: keys, mountPath: /secret, readOnly: true}
      volumes:
        - {name: code, configMap: {name: app-code}}
        - {name: keys, secret: {secretName: keys}}
---
