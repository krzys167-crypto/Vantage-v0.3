            - {name: PORT, value: "8090"}
            - {name: INSTANCE, valueFrom: {configMapKeyRef: {name: scenario, key: LEGACY_INSTANCE}}}
          ports: [{containerPort: 8090}]
          readinessProbe: {tcpSocket: {port: 8090}, periodSeconds: 2}
          resources: {limits: {cpu: 100m, memory: 64Mi}, requests: {cpu: 10m, memory: 16Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: keys, mountPath: /secret, readOnly: true}
      volumes:
        - {name: code, configMap: {name: app-code}}
        - {name: keys, secret: {secretName: keys}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fx, labels: {app: fx}}
spec:
  replicas: 1
  selector: {matchLabels: {app: fx}}
  template:
