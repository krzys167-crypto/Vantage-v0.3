---
apiVersion: v1
kind: Service
metadata: {name: api}
spec: {selector: {app: api}, ports: [{port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, labels: {app: api}}
spec:
  replicas: 1          # one resolver cache, so flush/resolve see the same state
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: mirror.gcr.io/library/python:3.12-alpine
          workingDir: /app
          command: ["python", "-u", "server.py"]
          env:
            - {name: ROLE, value: api}
            - {name: PORT, value: "8080"}
            - {name: RESOLVER, value: "{{NET}}.10"}
            - {name: VANTAGE_HOST, valueFrom: {configMapKeyRef: {name: scenario, key: VANTAGE_HOST}}}
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 2}
          resources: {limits: {cpu: 200m, memory: 96Mi}, requests: {cpu: 20m, memory: 24Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: keys, mountPath: /secret, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - {name: code, configMap: {name: app-code}}
        - {name: keys, secret: {secretName: keys}}
        - {name: config, configMap: {name: svc-config}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prober, labels: {app: prober}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prober}}
  template:
    metadata: {labels: {app: prober}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prober
          image: mirror.gcr.io/library/python:3.12-alpine
          command: ["python", "-u", "/app/probe.py"]
          env: [{name: OUT, value: "-"}]
          resources: {limits: {cpu: 200m, memory: 64Mi}, requests: {cpu: 20m, memory: 16Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app}
      volumes:
        - {name: code, configMap: {name: app-code}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: same-namespace-only}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
