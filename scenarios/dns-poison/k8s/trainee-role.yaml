# Hosted range: what the trainee's ServiceAccount may do in the session namespace.
# Enough to diagnose and repair the zone and the api's resolver config; nothing
# that holds the flag secret, drives the prober or changes the scenario.
# Applied by range/range.sh with -n <ns>.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: trainee}
rules:
  # read the workload topology (service ClusterIPs are where the hosts live).
  # No Secrets at all: the only one is the flag/signing key.
  - apiGroups: [""]
    resources: [pods, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  # repair: the zone, the api's config (hosts.json overrides, api.json) and a
  # rolling restart of dns and api (the api's resolver cache lives in memory)
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [zone, svc-config]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [dns, api]
    verbs: [patch]
