# Hosted range: what the trainee's ServiceAccount may do in the session namespace.
# Enough to diagnose and repair the gateway; nothing that touches the backend's
# secrets, the prober or the evidence. Applied by range/range.sh with -n <ns>.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: trainee}
rules:
  # read the workload topology. Deliberately no Secrets (list/watch would leak
  # them) and no ConfigMaps (scenario parameters are the platform's business).
  - apiGroups: [""]
    resources: [pods, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  # repair: the gateway's PKI and a rolling restart of the gateway only
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [gateway-pki]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [issuer-ca, clients-ca]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [gateway]
    verbs: [patch]
