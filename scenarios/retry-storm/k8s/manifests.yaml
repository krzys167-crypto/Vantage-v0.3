# Retry Storm on k3d. Applied by framework scenario_up into namespace vantage-rs.
# ConfigMaps `scenario`, `app-code`, `svc-config`, `change-history` and Secret
# `keys` are created from .state/ by scripts/k8s_objects.sh. One replica each:
# the services keep their metrics in memory.
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory, labels: {app: inventory}}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata: {labels: {app: inventory}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: inventory
          image: mirror.gcr.io/library/python:3.12-alpine
          workingDir: /app
          command: ["python", "-u", "/app/server.py"]
          env:
            - {name: ROLE, value: inventory}
            - {name: PORT, value: "8090"}
          ports: [{containerPort: 8090}]
          readinessProbe: {tcpSocket: {port: 8090}, periodSeconds: 2}
          resources: {limits: {cpu: 1000m, memory: 128Mi}, requests: {cpu: 50m, memory: 32Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app/server.py, subPath: server.py}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: keys, mountPath: /secret, readOnly: true}
      volumes:
        - {name: code, configMap: {name: app-code}}
        - {name: config, configMap: {name: svc-config}}
        - {name: keys, secret: {secretName: keys}}
---
apiVersion: v1
kind: Service
metadata: {name: inventory}
spec: {selector: {app: inventory}, ports: [{port: 8090, targetPort: 8090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, labels: {app: api}}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: mirror.gcr.io/library/python:3.12-alpine
          workingDir: /app
          command: ["python", "-u", "/app/server.py"]
          env:
            - {name: ROLE, value: api}
            - {name: PORT, value: "8080"}
            - {name: VANTAGE_HOST, valueFrom: {configMapKeyRef: {name: scenario, key: VANTAGE_HOST}}}
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 2}
          resources: {limits: {cpu: 1000m, memory: 128Mi}, requests: {cpu: 50m, memory: 32Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app/server.py, subPath: server.py}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: keys, mountPath: /secret, readOnly: true}
      volumes:
        - {name: code, configMap: {name: app-code}}
        - {name: config, configMap: {name: svc-config}}
        - {name: keys, secret: {secretName: keys}}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec: {selector: {app: api}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen, labels: {app: loadgen}}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata: {labels: {app: loadgen}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: loadgen
          image: mirror.gcr.io/library/python:3.12-alpine
          workingDir: /app
          command: ["python", "-u", "/app/server.py"]
          env:
            - {name: ROLE, value: loadgen}
            - {name: PORT, value: "8099"}
            - {name: RPS, valueFrom: {configMapKeyRef: {name: scenario, key: RPS}}}
          ports: [{containerPort: 8099}]
          readinessProbe: {tcpSocket: {port: 8099}, periodSeconds: 2}
          resources: {limits: {cpu: 500m, memory: 128Mi}, requests: {cpu: 50m, memory: 32Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app/server.py, subPath: server.py}
      volumes:
        - {name: code, configMap: {name: app-code}}
---
apiVersion: v1
kind: Service
metadata: {name: loadgen}
spec: {selector: {app: loadgen}, ports: [{port: 8099, targetPort: 8099}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prober, labels: {app: prober}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prober}}
  template:
    metadata: {labels: {app: prober}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prober
          image: mirror.gcr.io/library/python:3.12-alpine
          command: ["python", "-u", "/app/probe.py"]
          env: [{name: OUT, value: "-"}]
          resources: {limits: {cpu: 200m, memory: 64Mi}, requests: {cpu: 20m, memory: 16Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app/probe.py, subPath: probe.py}
      volumes:
        - {name: code, configMap: {name: app-code}}
---
# Isolation: services accept traffic only from inside the namespace; nothing
# may leave it except DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: same-namespace-only}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
