# Hosted range: what the trainee's ServiceAccount may do in the session namespace.
# Enough to diagnose the storm and repair capacity and the retry policy; nothing
# that holds the flag secret, drives the traffic or changes the scenario.
# Applied by range/range.sh with -n <ns>.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: trainee}
rules:
  # read the workload topology. No Secrets at all (the only one holds the flag
  # and the reservation signing key) and no ConfigMaps beyond the job's own.
  - apiGroups: [""]
    resources: [pods, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  # repair: the service config (capacity + retry policy; fallback_static lives
  # here too, and is judged by the hidden assertions) and the change history
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [svc-config]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [change-history]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [inventory, api]
    verbs: [patch]
