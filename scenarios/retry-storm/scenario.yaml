# Vantage Scenario DSL v0 — validated by dsl/scenario.schema.v0.json
apiVersion: vantage.dev/v0
meta:
  id: retry-storm
  title: Retry Storm
  version: 0.1.0
  difficulty: 4
  est_minutes: 45
  tags: [overload, retries, metastable-failure, capacity, slo]
  skills: [load-amplification-analysis, backoff-and-jitter, capacity-planning, change-archaeology, slo-latency]

env:
  mode: docker             # docker | k3d (MODE=k3d make up)
  compose: docker-compose.yml
  manifests: k8s/manifests.yaml
  seed: sha256(user_id + ":retry-storm:v0")
  user_mutation:
    capacity_cut: "seed[6] % 2 -> worker pool 8->2 | CPU limit 1000m->500m"
    retry_policy: "seed[7] % 2 -> 120 ms x 7 retries | 150 ms x 6 retries without jitter"
    user_rps: "36 + seed[9] % 8"
    flag: "HMAC(sha256(seed:flag), host)[0:24]"
  limits: {cpus: 2, memory_mb: 512}

services:
  - {name: inventory, role: dependency, port: 8090}
  - {name: api,       role: target,     port: 8080, upstream: inventory}
  - {name: loadgen,   role: dependency, port: 8099}
  - {name: prober,    role: observer,   interval_s: 0.5}

faults:
  - {id: cpu_throttle,        stage: capacity, target: inventory, params: {variants: [workers_8_to_2, cpu_1000m_to_500m]}, at: break}
  - {id: retry_amplification, stage: client,   target: api, params: {timeout_ms: "120..150", retries: "6..7", backoff_ms: 0}, at: break}

traffic:
  synthetic: {tool: prober, interval_s: 0.5, timeout_s: 5, flow: "api /checkout -> inventory /reserve"}
  sli:
    availability: "ok_probes / all_probes since break"
    latency: {p95_ms: 150, p99_ms: 500}
  slo: {availability: 0.99, window_s: 60}

assertions:
  public:
    - {id: A1, type: checkout_ok, expect: {status: 200, header: X-Vantage-Flag}}
    - {id: A2, type: capacity_headroom, service: inventory, max_utilization: 0.6, max_p95_queue_ms: 50, detects: [cpu_throttle]}
    - {id: A3, type: retry_amplification, service: api, max_attempts_per_request: 1.2, detects: [retry_amplification]}
    - {id: A4, type: latency_slo, service: api, p95_ms: 150, detects: [cpu_throttle, retry_amplification]}
    - {id: A5, type: health_stable_Ns, window_s: 60}
    - {id: A6, type: log_absence, service: api, pattern: "upstream timeout"}
  hidden:
    - {id: H1, type: retries_bounded, max: 3, detects: [retry_amplification]}
    - {id: H2, type: backoff_with_jitter, min_backoff_ms: 50, detects: [retry_amplification]}
    - {id: H3, type: timeout_sane, range_ms: [200, 3000]}
    - {id: H4, type: backlog_bounded, max: 1000}
    - {id: H5, type: no_static_fallback, security_critical: true}
    - {id: H6, type: flag_authentic}

scoring:
  weights: {availability: 20, time_to_recover: 35, latency: 10, blast_radius: 15, hidden: 20}
  time_to_recover: {full_s: 900, zero_s: 3600}
  latency: {full_p95_ms: 150, zero_p95_ms: 1500}
  penalties: {hint: 5, restart_unaffected: 10}
  blast_radius:
    unaffected: [loadgen, prober]
    # docker: config is live; a restart drops every in-flight request
    recreate_penalty:
      - {service: api, mode: docker, points: 3}
      - {service: inventory, mode: docker, points: 3}
  caps: {public_fail: 40, security_weakened: 65}
  tiers: {pass: 60, merit: 80, elite: 92}

evidence:
  collect: [probes_jsonl, timeline_tsv, assertions_json, file_hashes, instance_identities]
  files: [.state/config]
  sign: {alg: ed25519, artifact: report.json}

hints:
  - after_s: 300
    cost: 5
    text: "Compare what users send (api checkouts per second) with what inventory receives (make metrics). If inventory gets several times more requests than users make, who is sending the rest?"
  - after_s: 600
    cost: 5
    text: "Read .state/config/history/CHANGELOG.md. Two changes went out the same day; the traffic spike only tipped the system over. Restoring capacity alone does not end a storm that the retries keep feeding."
  - after_s: 1200
    cost: 5
    text: "A sane client: a few retries at most, exponential backoff with jitter, and a timeout above the service's real latency. Serving a static fallback hides the outage and is graded as a regression."

# Post-mortem catalog (make postmortem / make debrief): the grader checks the
# causes named in the write-up against the ones this attempt's seed produced.
debrief:
  timeline_tolerance_s: 30
  causes:
    - {id: inventory_workers_cut,          when: "seed[6] % 2 == 0", text: "inventory's worker pool was cut from 8 to 2"}
    - {id: inventory_cpu_limit_cut,        when: "seed[6] % 2 == 1", text: "inventory's CPU limit was halved to 500m"}
    - {id: retries_7x_120ms_no_backoff,    when: "seed[7] % 2 == 0", text: "the api retries 7 times with a 120 ms timeout and no backoff"}
    - {id: retries_6x_150ms_no_jitter,     when: "seed[7] % 2 == 1", text: "the api retries 6 times with a 150 ms timeout, no backoff and no jitter"}
    - {id: traffic_burst, kind: contributing, text: "a short traffic burst pushed the system into the storm"}
    - {id: inventory_memory_leak,         kind: decoy, text: "inventory leaks memory and slows down over time"}
    - {id: api_connection_pool_exhausted, kind: decoy, text: "the api ran out of connections to inventory"}
    - {id: user_traffic_doubled,          kind: decoy, text: "user traffic doubled for good"}
  facts:
    - {id: capacity_change, value: "4000 + seed[10:13] % 5000", format: "CHG-{}", text: "the change that cut inventory's capacity"}
    - {id: retry_change,    value: "4001 + seed[10:13] % 5000", format: "CHG-{}", text: "the change that made the api retry harder"}
