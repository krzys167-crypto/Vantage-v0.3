<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantage Range</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --muted:#9aa3b2; --ok:#3fb27f; --bad:#e5534b; --warn:#d8a54a; --acc:#6aa9ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --panel:#fff; --line:#dde1e7; --text:#151821; --muted:#5b6474; --acc:#2563eb; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing:.2px } h1 span { color: var(--muted); font-weight: 400 }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap:10px; }
  .scn { cursor:pointer; text-align:left; color:inherit; font:inherit; }
  .scn:hover { border-color: var(--acc); } .scn b { display:block } .scn small { color:var(--muted) }
  button, .btn { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line) }
  button:disabled { opacity:.5; cursor:default }
  input { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; width:100% }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font-size:13px }
  .muted { color:var(--muted) } .ok { color:var(--ok) } .bad { color:var(--bad) } .warn { color:var(--warn) }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  table { width:100%; border-collapse:collapse } td, th { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left }
  th { color:var(--muted); font-weight:500; font-size:13px }
  .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 10px; margin:2px; font-size:13px }
  .hidden { display:none }
</style>
</head>
<body>
<main>
  <header>
    <h1>Vantage Range <span>· incydenty produkcyjne na żywo</span></h1>
    <div id="who" class="row muted"></div>
  </header>

  <section id="login" class="card hidden" style="margin-top:20px">
    <p>Zaloguj się. Wynik, odznaki i post-mortem będą przypisane do Twojego konta.</p>
    <div class="row"><input id="email" type="email" placeholder="e-mail" style="max-width:320px">
      <button id="magic">Wyślij link logowania</button></div>
    <p id="loginMsg" class="muted"></p>
  </section>

  <section id="app" class="hidden">
    <h2>Twój incydent</h2>
    <div id="session" class="card"></div>

    <h2>Scenariusze</h2>
    <div id="scenarios" class="grid"></div>

    <h2>Profil</h2>
    <div id="profile" class="card muted">…</div>

    <h2>Liga (ten miesiąc)</h2>
    <div id="league" class="card muted">…</div>
  </section>
  <p id="err" class="bad"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let sb, token = null, poll = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" } });
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  return { ok: r.ok, status: r.status, body };
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString() : "";

function renderSession(s) {
  const el = $("session");
  if (!s || ["stopped", "expired"].includes(s.status)) {
    el.innerHTML = `<p class="muted">Brak aktywnego incydentu. Wybierz scenariusz poniżej. Zegar MTTR rusza w chwili startu.</p>`;
    return;
  }
  const status = { starting: '<span class="warn">uruchamianie… (1–3 min)</span>', ready: '<span class="bad">INCYDENT TRWA</span>',
                   grading: '<span class="warn">ocenianie…</span>', graded: '<span class="ok">ocenione</span>',
                   failed: '<span class="bad">nie udało się uruchomić</span>' }[s.status] || esc(s.status);
  let html = `<div class="row" style="justify-content:space-between"><div><b>${esc(s.scenario)}</b> · ${status}</div>
    <div class="muted">start ${t(s.created)} · wygasa ${t(s.expires)}</div></div>`;
  if (s.status === "ready" || s.status === "graded") {
    html += `<p>Masz dostęp tylko do swojego namespace, w zakresie uprawnień potrzebnych do naprawy. Diagnozuj jak na produkcji:</p>
      <pre>export KUBECONFIG=~/Downloads/vantage.kubeconfig
kubectl get pods,svc,events
kubectl logs deploy/api --tail=50</pre>
      <div class="row"><button id="kc">Pobierz kubeconfig</button>
      <button id="grade" ${s.status !== "ready" ? "disabled" : ""}>Gotowe: oceń naprawę</button>
      <button class="ghost" id="stop">Zakończ</button></div>`;
  }
  if (s.status === "graded") {
    html += `<p style="margin-top:12px">Wynik: <b>${esc(s.score)}</b> · poziom <b>${esc(s.tier)}</b> (podpisany przez grader).
      Teraz napisz post-mortem: <code>framework/postmortem.py</code>. Szczegóły w docs/debrief.md.</p>`;
  }
  if (s.status === "failed") html += `<pre>${esc(s.log_tail)}</pre><button class="ghost" id="stop">Wyczyść</button>`;
  el.innerHTML = html;
  $("kc")?.addEventListener("click", downloadKubeconfig);
  $("grade")?.addEventListener("click", grade);
  $("stop")?.addEventListener("click", async () => { await api("/api/sessions/mine/stop", { method: "POST" }); refresh(); });
}

async function downloadKubeconfig() {
  const r = await api("/api/sessions/mine/kubeconfig");
  if (!r.ok) return showErr(r.body.error);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([r.body], { type: "application/yaml" }));
  a.download = "vantage.kubeconfig"; a.click();
}

async function grade() {
  $("grade").disabled = true; $("grade").textContent = "ocenianie… (do 2 min)";
  const r = await api("/api/sessions/mine/grade", { method: "POST" });
  if (!r.ok) showErr(r.body.error);
  refresh(); loadProfile();
}

async function start(id) {
  const r = await api("/api/sessions", { method: "POST", body: JSON.stringify({ scenario: id }) });
  if (!r.ok) return showErr(r.body.error);
  refresh();
}

async function refresh() {
  const r = await api("/api/sessions/mine");
  if (!r.ok) return showErr(r.body.error);
  renderSession(r.body.session);
  const s = r.body.session;
  clearTimeout(poll);
  if (s && ["starting", "grading"].includes(s.status)) poll = setTimeout(refresh, 4000);
}

async function loadScenarios() {
  const r = await api("/api/scenarios");
  $("scenarios").innerHTML = r.body.scenarios.map(s => `<button class="card scn" data-id="${esc(s.id)}">
    <b>${esc(s.title)}</b><small>trudność ${esc(s.difficulty)}/5 · ~${esc(s.est_minutes)} min</small></button>`).join("");
  document.querySelectorAll(".scn").forEach(b => b.addEventListener("click", () => start(b.dataset.id)));
}

async function loadProfile() {
  const r = await api("/api/profile");
  if (!r.ok) { $("profile").textContent = r.body.error; return; }
  const p = r.body.result;
  const rows = Object.entries(p.scenarios).map(([k, s]) => `<tr><td>${esc(k)}</td><td>${esc(s.best_score ?? "–")}</td>
    <td>${esc(s.best_tier ?? "")}</td><td>${s.best_mttr_s ? (s.best_mttr_s / 60).toFixed(1) + " min" : "–"}</td>
    <td>${s.debrief_verified ? '<span class="ok">✓</span>' : ""}</td></tr>`).join("");
  $("profile").classList.remove("muted");
  $("profile").innerHTML = `<p class="muted">alias w lidze: ${esc(p.alias)}</p>
    <div>${p.badges.map(b => `<span class="badge" title="${esc(b.text)}">${esc(b.badge)}${b.scenario ? " · " + esc(b.scenario) : ""}</span>`).join("") || '<span class="muted">Brak odznak. Przyznaje się je tylko za potwierdzone naprawy i post-mortemy.</span>'}</div>
    ${rows ? `<table style="margin-top:10px"><tr><th>scenariusz</th><th>najlepszy</th><th>poziom</th><th>MTTR</th><th>post-mortem</th></tr>${rows}</table>` : ""}`;
}

async function loadLeague() {
  const r = await fetch("/api/league").then(x => x.json()).catch(() => null);
  if (!r || !r.result) { $("league").textContent = "liga niedostępna"; return; }
  const lg = r.result;
  $("league").classList.remove("muted");
  $("league").innerHTML = lg.rows.length ? `<table><tr><th>#</th><th>gracz</th><th>punkty</th><th>scenariusze</th></tr>
    ${lg.rows.map(x => `<tr><td>${x.rank}</td><td>${esc(x.alias)}</td><td>${x.points}</td><td>${x.scenarios}</td></tr>`).join("")}</table>`
    : '<span class="muted">Nikt jeszcze nie zapunktował w tym miesiącu.</span>';
}

function showErr(m) { $("err").textContent = m || ""; if (m) setTimeout(() => $("err").textContent = "", 8000); }

async function main() {
  const cfg = await fetch("/config.json").then(r => r.json());
  if (!cfg.supabase_url) { showErr("panel nie ma konfiguracji logowania (PANEL_SUPABASE_URL)"); return; }
  sb = supabase.createClient(cfg.supabase_url, cfg.supabase_key);
  const { data } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, session) => { if (session && !token) boot(session); });
  if (data.session) return boot(data.session);
  $("login").classList.remove("hidden");
  $("magic").addEventListener("click", async () => {
    const { error } = await sb.auth.signInWithOtp({ email: $("email").value, options: { emailRedirectTo: location.origin } });
    $("loginMsg").textContent = error ? error.message : "Sprawdź skrzynkę i kliknij link.";
  });
}

function boot(session) {
  token = session.access_token;
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").innerHTML = `${esc(session.user.email)} <button class="ghost" id="out">Wyloguj</button>`;
  $("out").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
  // the access token rotates hourly; supabase-js refreshes it, we pick up the new one
  sb.auth.onAuthStateChange((_e, s) => { if (s) token = s.access_token; });
  loadScenarios(); refresh(); loadProfile(); loadLeague();
}
main().catch(e => showErr(String(e)));
</script>
</body>
</html>
